<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Catatan Obat – R. Dahlia</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f4f8;--cd:#fff;--tx:#1f1d2e;--mu:#8c8aa3;--ln:#ececf3;--ac:#7f6fe0;--acl:#dcd8fa;--on:#fff;--tb:#fde6d2;--tc:#b45309;--pn:#0f766e;--ok:#2e8f5a;--okb:#d9f3e2;--wt:#a86f00;--wb:#fdefc4;--lt:#d23f57;--ltb:#fddde1;--sh:0 6px 18px rgba(80,70,140,.1);color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#14131c;--cd:#211f2e;--tx:#f1f0fa;--mu:#a09eb8;--ln:#302e42;--ac:#a99cf5;--acl:#3a3560;--on:#1b1630;--tb:#4a3524;--tc:#ffb680;--pn:#5eead4;--ok:#6fe0a0;--okb:#1c4332;--wt:#f3c45a;--wb:#4a3f1c;--lt:#ff8fa2;--ltb:#522a37;--sh:0 6px 18px rgba(0,0,0,.4);color-scheme:dark}}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--tx);font:14px/1.45 Manrope,system-ui,-apple-system,"Segoe UI",sans-serif;max-width:460px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top,0px)) 16px calc(110px + env(safe-area-inset-bottom,0px))}
svg.i{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
h2{font-size:16px;font-weight:800;margin:6px 2px 10px}
.hd{display:flex;align-items:center;gap:10px;margin-bottom:14px}.hd>div:nth-child(2){flex:1}.hd b{font-size:15px;display:block}.hd small{color:var(--mu);font-size:11.5px}
.av{width:44px;height:44px;border-radius:50%;background:var(--acl);display:grid;place-items:center;font-size:24px}
.ib{width:42px;height:42px;border-radius:50%;background:var(--cd);box-shadow:var(--sh);display:grid;place-items:center;font-size:19px;position:relative}
.ib i{position:absolute;top:7px;right:8px;min-width:16px;height:16px;border-radius:99px;background:#f0647a;color:#fff;font:800 10px/16px Manrope,sans-serif;text-align:center;font-style:normal}
.sb{display:none;margin-bottom:12px}.sb.on{display:block}
.cd{border-radius:26px;padding:16px;margin-bottom:14px;color:#2a2438}
.pkc{background:linear-gradient(160deg,#f0c3c3,#e6adad)}.lvc{background:linear-gradient(150deg,#cdc8f6,#aaa3ea)}.pec{background:#fbe3d0}.mic{background:#b9ece1}.coc{background:linear-gradient(160deg,#ffa8a8,#ff8f8f)}.lv2{background:#dcdaff}
.ct{display:flex;align-items:center;gap:10px}.ct b{font-size:15px}.ct small{display:block;font-size:12px;opacity:.75}.sp{flex:1}
.ci{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.75);display:grid;place-items:center;font-size:18px;color:#2a2438;flex:none}
.nums{display:grid;grid-template-columns:repeat(4,1fr);margin-top:14px}.nums small{display:block;font-size:11.5px;opacity:.75}.nums strong{font-size:26px;font-weight:800}
.big{font-size:44px;font-weight:800;line-height:1.1}
.ring{width:96px;height:96px;border-radius:50%;display:grid;place-items:center;flex:none}.ring div{width:76%;height:76%;border-radius:50%;background:#b3acec;display:grid;place-items:center;text-align:center;line-height:1.15}.ring b{font-size:15px}.ring small{font-size:10.5px;opacity:.8}
.gr{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.gr .cd{margin:0;min-height:148px;display:flex;flex-direction:column;text-align:left}.gr p{font-size:12.5px;opacity:.75;margin:8px 0 auto}.go{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:13px;margin-top:10px}
.pn{background:var(--cd);border-radius:22px;padding:4px 14px;box-shadow:var(--sh);margin-bottom:14px}
.it{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--ln)}.it:first-child{border-top:0}
.tl{min-width:46px;height:46px;padding:0 5px;border-radius:15px;display:grid;place-items:center;font-weight:800;font-size:12.5px;background:var(--acl);color:var(--ac);flex:none}
.tl.tm{background:var(--tb);color:var(--tc)}.nm{color:var(--pn)}.tx{flex:1;min-width:0}.tx b{display:block;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tx small{color:var(--mu);font-size:11.5px;display:block}
.dn{opacity:.55}
.pill{padding:3px 10px;border-radius:99px;font-size:11px;font-weight:800;white-space:nowrap}.ok{background:var(--okb);color:var(--ok)}.wt{background:var(--wb);color:var(--wt)}.lt{background:var(--ltb);color:var(--lt)}
.rb{width:38px;height:38px;border-radius:50%;background:var(--acl);color:var(--ac);display:grid;place-items:center;font-size:17px;flex:none}
.tabs{display:flex;gap:8px;overflow-x:auto;margin-bottom:12px;padding:2px 2px 6px}.tabs button{padding:8px 14px;border-radius:99px;background:var(--cd);font-weight:700;font-size:12.5px;white-space:nowrap;box-shadow:var(--sh)}.tabs .on{background:var(--ac);color:var(--on)}
.pt{border-top:1px solid var(--ln);padding:6px 0}.pt:first-child{border-top:0}.ph{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:4px 0}.pb{display:none}.pt.ex .pb{display:block}.ch{transition:transform .2s;color:var(--ac);font-size:16px}.pt.ex .ch{transform:rotate(90deg)}
.ms{display:flex;gap:10px;overflow-x:auto;margin-bottom:14px;padding-bottom:4px}.ms div{min-width:108px;border-radius:18px;padding:12px;background:var(--cd);box-shadow:var(--sh)}.ms div.n{background:#cfcaf7;color:#2a2438}.ms div.a{background:#ffb1b1;color:#2a2438}.ms small{display:block;font-size:11.5px;opacity:.75}.ms b{font-size:16px}
.bar{height:9px;border-radius:9px;margin-top:6px;background:var(--acl)}.bar i{display:block;height:100%;border-radius:9px}.cat{margin:12px 0;font-size:13px;font-weight:700;display:flex;flex-wrap:wrap}.cat span{margin-left:auto;color:var(--mu)}.cat .bar{flex-basis:100%}
.empty{color:var(--mu);font-size:12.5px;padding:10px 0}
.btn{padding:9px 16px;border-radius:14px;background:var(--acl);color:var(--ac);font-weight:700}.pri{background:var(--ac);color:var(--on)}.sm{padding:7px 13px;font-size:12px}.wide{width:100%;margin-bottom:14px}
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));background:var(--cd);border-radius:26px;padding:8px;display:flex;gap:6px;box-shadow:0 10px 30px rgba(60,50,120,.25);z-index:5}
nav button{width:52px;height:52px;border-radius:18px;display:grid;place-items:center;font-size:22px;position:relative}nav .on{background:var(--acl);color:var(--ac)}
nav b{position:absolute;top:2px;right:2px;background:#f0647a;color:#fff;font-size:10px;min-width:17px;height:17px;border-radius:99px;display:grid;place-items:center}
.foot{color:var(--mu);font-size:11.5px;text-align:center}
dialog{border:0;border-radius:26px;background:var(--cd);color:var(--tx);padding:20px;width:min(520px,94vw);max-height:92vh;overflow:auto;box-shadow:0 20px 50px rgba(20,10,60,.45)}dialog::backdrop{background:rgba(30,20,70,.5)}
dialog h3{margin-bottom:10px;color:var(--ac)}
label{display:block;font-size:12.5px;font-weight:700;color:var(--mu);margin:8px 0 3px}
input:not([type=checkbox]),select,textarea{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--ln);border-radius:14px;padding:9px 12px;width:100%}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mr{display:grid;grid-template-columns:1.6fr 1fr auto;gap:8px;margin:10px 0;padding-bottom:10px;border-bottom:1px dashed var(--ln)}.mr .rt,.mr .sl{grid-column:1/-1}
.sl{display:flex;gap:14px;flex-wrap:wrap}.sl label,.sl .ad{display:flex;align-items:center;gap:6px;margin:0;color:var(--tx);font-size:13px}.sl .ad input{width:auto}
.row{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ac);color:var(--on);padding:9px 18px;border-radius:99px;font-weight:800;z-index:99;max-width:90vw;text-align:center}
</style>
</head>
<body>
<header class="hd"><div class="av">🧑‍⚕️</div><div><b>Halo, Perawat!</b><small id="sub"></small></div>
  <button class="ib" id="sbt" aria-label="Cari"></button><button class="ib" id="bell" aria-label="Lihat obat terlambat"></button></header>
<div class="sb" id="sb"><input id="q" placeholder="Cari nama, kamar, dokter…" aria-label="Cari"></div>
<main id="v"></main>
<p class="foot"><span>Data tersimpan lokal & tersinkron ke Google Sheet.</span> Alat bantu catatan, bukan pengganti rekam medis resmi.</p>
<nav id="nav" aria-label="Menu utama"></nav>

<dialog id="dlg"><form id="f"><h3>Data pasien</h3>
  <label for="nama">Nama pasien</label><input id="nama" required>
  <div class="g2"><div><label for="kamar">Kamar</label><input id="kamar" required></div><div><label for="dokter">Dokter</label><input id="dokter" required></div></div>
  <label>Obat</label><div id="meds"></div><button type="button" class="btn sm" id="addm">Tambah obat</button>
  <label for="rc">Rencana tindakan</label><textarea id="rc" rows="3" placeholder="Contoh: observasi TTV tiap 4 jam"></textarea>
  <div class="row"><button type="button" class="btn" id="del" style="margin-right:auto;color:var(--lt)" hidden>Hapus pasien</button><button type="button" class="btn" data-x>Batal</button><button class="btn pri">Simpan</button></div>
</form></dialog>
<dialog id="tdlg"><form id="tf"><h3>Input TTV</h3>
  <label for="tp">Pasien</label><select id="tp" required></select>
  <div class="g3"><div><label for="td">Tekanan darah</label><input id="td" placeholder="120/80"></div><div><label for="nd">Nadi (x/mnt)</label><input id="nd" type="number"></div><div><label for="rr">Napas (x/mnt)</label><input id="rr" type="number"></div><div><label for="sh">Suhu (°C)</label><input id="sh" type="number" step="0.1"></div><div><label for="sp">SpO₂ (%)</label><input id="sp" type="number"></div></div>
  <div class="row"><button type="button" class="btn" data-x>Batal</button><button class="btn pri">Simpan TTV</button></div>
</form></dialog>
<dialog id="bdlg"><h3>Cadangkan / Pulihkan</h3><p style="color:var(--mu);font-size:12px">Cadangkan: salin teks di bawah. Pulihkan: tempel teks cadangan lalu tekan Pulihkan.</p><label for="bt">Data cadangan</label><textarea id="bt" rows="9"></textarea>
  <div class="row"><button class="btn" data-x>Tutup</button><button class="btn pri" id="br">Pulihkan</button></div></dialog>
<dialog id="cdlg"><p id="cm" style="margin-bottom:6px"></p><div class="row"><button class="btn" data-x>Batal</button><button class="btn pri" id="cy" style="background:#dc2626;color:#fff">Ya, lanjutkan</button></div></dialog>

<script>
// URL Google Apps Script yang terhubung ke Google Sheet
const GAS_URL = "https://script.google.com/macros/s/AKfycbyQRjgf7Et79WLd_UN5TO3WA8WWBjsTBWbIkh3L6tB8nDvEiGesAlkOo9xny0n1B0Rw/exec";

const P={search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>',bell:'<path d="M6 16V11a6 6 0 0112 0v5l2 2H4z"/><path d="M10 21h4"/>',plus:'<path d="M12 5v14M5 12h14"/>',chev:'<path d="M9 6l6 6-6 6"/>',home:'<path d="M3 11l9-8 9 8v9H3z"/>',users:'<circle cx="9" cy="8" r="3.5"/><path d="M2 20c0-4 3-6 7-6s7 2 7 6M17 5a3.5 3.5 0 010 7M22 20c0-3-2-5-5-5.5"/>',heart:'<path d="M12 20s-8-5-8-11a4.5 4.5 0 018-2.5A4.5 4.5 0 0120 9c0 6-8 11-8 11z"/>',syr:'<path d="M18 3l3 3-3 3M15 6l-9 9v3h3l9-9M3 21l3-3"/>',check:'<path d="M5 12l5 5 9-10"/>',pill:'<rect x="3" y="9" width="18" height="6" rx="3" transform="rotate(-35 12 12)"/><path d="M9 8l6 8"/>',undo:'<path d="M9 14L4 9l5-5M4 9h10a6 6 0 010 12h-3"/>',edit:'<path d="M4 20h4L19 9l-4-4L4 16z"/>',arr:'<path d="M5 12h14M13 6l6 6-6 6"/>'};
const ic=n=>`<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${P[n]}</svg>`;
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const KEY="catatan-obat-v1",uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6),p2=n=>String(n).padStart(2,"0");
let data=[],tab="",pf="",view="home",sel="",editId=null,askCb=null;
const expanded={},COL=["#a592e6","#f7a8b6","#f9b85a","#f6dc7a","#a5d8a0","#93b9ee"];
const nowStr=()=>{const d=new Date();return `${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}T${p2(d.getHours())}:${p2(d.getMinutes())}`};
const isToday=v=>typeof v==="string"&&v.slice(0,10)===nowStr().slice(0,10),fmt=v=>typeof v==="string"&&v.length>=16?v.slice(11,16):"";
const toMin=t=>{const a=(t||"").split(":");return a.length<2?0:+a[0]*60+ +a[1]},tm=s=>{const t=toMin(s);return t<360?t+1440:t},nowMin=()=>{const d=new Date();return d.getHours()*60+d.getMinutes()};
const JD={Injeksi:[["Pagi",["09:00"]],["Siang",["17:00","21:00"]],["Malam",["01:00"]]],Oral:[["Pagi",["07:00","12:00","15:00"]],["Sore",["19:00"]],["Malam",["23:00"]]]};
const bt=s=>{const t=toMin(s);return t>=360&&t<720?"Pagi":t>=720&&t<1080?"Siang":"Malam"};
const grp=(r,s)=>{let g="";(JD[r||"Oral"]||[]).forEach(x=>{if(x[1].includes(s))g=x[0]});return g||bt(s)};
const shift=(m,s)=>(m.rute||"Oral")==="Oral"&&s==="07:00"?"Malam":(g=>g==="Sore"?"Siang":g)(grp(m.rute,s));
function abn(p){const a={},s=(p.td||"").split("/");if(s.length==2&&(+s[0]>=140||+s[0]<90||+s[1]>=90))a.td=1;if(p.nd&&(p.nd>100||p.nd<60))a.nd=1;if(p.rr&&(p.rr>24||p.rr<12))a.rr=1;if(p.sh&&(p.sh>=37.5||p.sh<36))a.sh=1;if(p.sp&&p.sp<95)a.sp=1;return a}
const byRoom=(a,b)=>String(a.kamar).localeCompare(String(b.kamar),"id",{numeric:true});
function toast(t){const e=document.createElement("div");e.className="toast";e.textContent=t;e.setAttribute("role","status");document.body.appendChild(e);setTimeout(()=>e.remove(),2200)}
function ask(msg,cb){$("#cm").textContent=msg;askCb=cb;$("#cdlg").showModal()}

// SINKRONISASI KE GOOGLE SHEETS (CLOUD)
async function persist(){
  try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}
  if(!GAS_URL||GAS_URL.includes("ISI_URL_GOOGLE_APPS_SCRIPT"))return;
  try{await fetch(GAS_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'save',data:data})})}
  catch(e){console.error("Gagal sinkron ke Cloud:",e);toast("Gagal sinkron ke Cloud")}
}
async function loadFromCloud(){
  if(!GAS_URL||GAS_URL.includes("ISI_URL_GOOGLE_APPS_SCRIPT"))return;
  try{const res=await fetch(GAS_URL+"?action=read"),c=await res.json();
    if(Array.isArray(c)&&c.length){data=c;try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}render()}
  }catch(e){console.error("Gagal membaca Cloud Data:",e)}
}

function doses(){const o=[];data.forEach(p=>(p.obat||[]).forEach(m=>(m.jam||[]).forEach(s=>{const dn=isToday(m.done&&m.done[s]);o.push({p,m,s,dn,late:!dn&&nowMin()>tm(s)+60,sh:shift(m,s)})})));return o.sort((a,b)=>tm(a.s)-tm(b.s))}
const dr=(x,sp)=>{const{p,m,s,dn,late,sh}=x;return `<div class="it${dn?" dn":""}"><div class="tl tm">${s}</div><div class="tx"><b>${esc(m.nama)} ${esc(m.dosis)}</b><small>${sp?'<span class="nm">'+esc(p.nama)+"</span> · Kamar "+esc(p.kamar)+" · ":""}${esc(m.rute||"Oral")} · ${sh}${dn?" · "+fmt(m.done[s]):""}</small></div><span class="pill ${dn?"ok":late?"lt":"wt"}">${dn?"Selesai":late?"Terlambat":"Menunggu"}</span><button class="rb" data-t="${p.id}|${m.id}|${s}" aria-label="${dn?"Batalkan":"Tandai diberikan"}: ${esc(m.nama)}">${ic(dn?"undo":"check")}</button></div>`};
const tabs=(arr,k,cur)=>`<div class="tabs">${arr.map(c=>`<button class="${cur==c[0]?"on":""}" data-${k}="${esc(c[0])}">${c[1]}</button>`).join("")}</div>`;

function chart(h){const d=h.filter(x=>+x.nd).slice(-12);if(d.length<2)return'<div class="empty">Grafik nadi tampil setelah 2 kali input TTV.</div>';
 const W=300,H=120,X=i=>10+i*(W-20)/(d.length-1),Y=v=>H-Math.max(0,Math.min(1,(v-40)/120))*H;
 return `<svg viewBox="0 0 ${W} ${H+18}" width="100%" role="img" aria-label="Grafik nadi"><rect x="0" y="${Y(100)}" width="${W}" height="${Y(60)-Y(100)}" rx="8" fill="var(--acl)" opacity=".6"/><polyline points="${d.map((x,i)=>X(i)+","+Y(+x.nd)).join(" ")}" fill="none" stroke="var(--ac)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>${d.map((x,i)=>`<circle cx="${X(i)}" cy="${Y(+x.nd)}" r="4" fill="var(--ac)"/>`).join("")}<text x="0" y="${H+14}" font-size="10" fill="var(--mu)">${fmt(d[0].t)}</text><text x="${W}" y="${H+14}" font-size="10" fill="var(--mu)" text-anchor="end">${fmt(d[d.length-1].t)}</text></svg><small style="color:var(--mu);font-size:11px">Area ungu muda: nadi normal 60–100 x/mnt</small>`}

const V={
home(a,G,L,W){const pc=a.length?Math.round(G/a.length*100):0,nx=a.filter(x=>!x.dn).slice(0,5);
 const T=[["pec","Jadwal Obat","obat","Pantau pemberian obat tiap pasien",L?L+" terlambat":"Semua tepat waktu"],["lv2","TTV","ttv","Tensi, nadi, napas, suhu, SpO₂","Lihat grafik"],["mic","Pasien","pasien","Data pasien dan rencana tindakan",data.length+" pasien"],["coc","Injeksi","inj","Obat injeksi hari ini","Lihat jadwal"]];
 return `<section class="cd lvc"><div class="ct"><div class="ci">${ic("pill")}</div><b>Progres Pemberian Obat</b></div><div class="ct" style="margin-top:12px"><div class="sp"><div class="big">${pc}%</div><small>Hari ini</small></div><div class="ring" style="background:conic-gradient(#fff ${pc}%,rgba(255,255,255,.35) 0)"><div><span><b>${G}/${a.length}</b><small>jadwal</small></span></div></div></div></section>
 <section class="cd pkc"><div class="ct"><div class="ci">${ic("users")}</div><div class="sp"><b>R. Dahlia</b><small>Ringkasan hari ini</small></div><button class="ci" data-q="add" aria-label="Tambah pasien">${ic("plus")}</button><button class="ci" data-q="ttv" aria-label="Input TTV">${ic("edit")}</button></div>
 <div class="nums">${[["Pasien",data.length],["Terlambat",L],["Menunggu",W],["Selesai",G]].map(n=>`<div><small>${n[0]}</small><strong>${n[1]}</strong></div>`).join("")}</div></section>
 <div class="gr">${T.map(t=>`<button class="cd ${t[0]}" data-go="${t[2]}"><div class="ct"><b>${t[1]}</b></div><p>${t[3]}</p><div class="go"><span>${t[4]}</span>${ic("arr")}</div></button>`).join("")}</div>
 <h2>Jadwal berikutnya</h2><div class="pn">${nx.map(x=>dr(x,1)).join("")||'<div class="empty">Semua jadwal hari ini sudah diberikan.</div>'}</div>
 <button class="btn wide" data-q="bk">Cadangkan / pulihkan data</button>`},
obat(a){const c={Pagi:0,Siang:0,Malam:0};a.forEach(x=>{if(!x.dn)c[x.sh]++});
 const h=data.filter(hit).sort(byRoom).map(p=>{const ds=a.filter(x=>x.p===p&&(!tab||x.sh===tab));if(tab&&!ds.length)return"";
 return `<div class="pt${expanded[p.id]?" ex":""}"><button class="ph" data-tp="${p.id}"><div class="tl">${esc(p.kamar)}</div><div class="tx"><b class="nm">${esc(p.nama)}</b><small>${esc(p.dokter)} · ${ds.filter(x=>x.dn).length}/${ds.length} jadwal</small></div><span class="ch">${ic("chev")}</span></button><div class="pb">${ds.map(x=>dr(x)).join("")||'<div class="empty">Tidak ada jadwal.</div>'}</div></div>`}).join("");
 return `<h2>Jadwal obat hari ini</h2>${tabs([["","Semua ("+a.length+")"],["Pagi","Pagi ("+c.Pagi+")"],["Siang","Siang ("+c.Siang+")"],["Malam","Malam ("+c.Malam+")"]],"f",tab)}<div class="pn">${h||`<div class="empty">${data.length?"Tidak ada jadwal yang cocok.":"Belum ada pasien. Tambah pasien atau pulihkan data."}</div>`}</div>`},
pasien(){const np=data.filter(p=>p.rc).length,L=data.filter(hit).sort(byRoom).map(p=>{const a=Object.keys(abn(p)).length,has=p.td||p.nd||p.rr||p.sh||p.sp;
 return `<div class="it"><div class="tl">${esc(p.kamar)}</div><div class="tx"><b class="nm">${esc(p.nama)}</b><small>${esc(p.dokter)} · ${(p.obat||[]).length} obat</small>${p.rc?`<small>Tindakan: ${esc(p.rc)}</small>`:""}</div>${has?`<span class="pill ${a?"lt":"ok"}">${a?"Perhatian":"Normal"}</span>`:""}<button class="rb" data-e="${p.id}" aria-label="Ubah ${esc(p.nama)}">${ic("edit")}</button></div>`}).join("");
 return `<h2>Daftar pasien</h2><button class="btn pri wide" data-q="add">Tambah pasien</button>${tabs([["","Semua ("+data.length+")"],["ada","Ada tindakan ("+np+")"],["tanpa","Belum ada ("+(data.length-np)+")"]],"p",pf)}<div class="pn">${L||'<div class="empty">Belum ada pasien yang cocok.</div>'}</div>`},
ttv(){const ps=data.slice().sort(byRoom);if(!sel||!ps.find(x=>x.id===sel))sel=(ps[0]||{}).id;const p=ps.find(x=>x.id===sel);
 if(!p)return `<h2>TTV</h2><div class="pn"><div class="empty">Belum ada pasien. Tambah pasien lebih dulu.</div></div>`;
 const A=abn(p),h=p.ttv||[],M=[["td","Tekanan darah",p.td,""],["nd","Nadi",p.nd,"x/mnt"],["rr","Napas",p.rr,"x/mnt"],["sh","Suhu",p.sh,"°C"],["sp","SpO₂",p.sp,"%"]];
 return `<h2>Tanda-tanda vital</h2>${tabs(ps.map(x=>[x.id,(Object.keys(abn(x)).length?"⚠ ":"")+"Kamar "+esc(x.kamar)+" · "+esc(x.nama)]),"s",sel)}
 <section class="pn" style="padding:14px"><div class="ct"><div class="sp"><small style="color:var(--mu)">Nadi terakhir</small><div class="big" style="font-size:32px">${esc(p.nd||"-")} <small style="font-size:13px;color:var(--mu)">x/mnt</small></div></div><button class="btn pri" data-q="ttv">Input TTV</button></div><div style="margin-top:10px">${chart(h)}</div></section>
 <div class="ms">${M.map(m=>`<div class="${m[2]?(A[m[0]]?"a":"n"):""}"><small>${m[1]}</small><b>${esc(m[2]||"-")} ${m[2]?m[3]:""}</b></div>`).join("")}</div>
 <h2>Riwayat TTV</h2><div class="pn">${h.slice().reverse().map(t=>`<div class="it"><div class="tx"><b>${esc((t.t||"-").replace("T"," · "))}</b><small>TD ${esc(t.td||"-")} · Nadi ${esc(t.nd||"-")} · RR ${esc(t.rr||"-")} · Suhu ${esc(t.sh||"-")}°C · SpO₂ ${esc(t.sp||"-")}%</small></div></div>`).join("")||'<div class="empty">Belum ada riwayat. Tekan Input TTV untuk mencatat.</div>'}</div>`},
inj(a){const I={};data.forEach(p=>(p.obat||[]).filter(m=>m.rute==="Injeksi").forEach(m=>{const k=String(m.nama).trim().toLowerCase();I[k]=I[k]||{n:String(m.nama).trim(),c:0};I[k].c+=(m.jam||[]).length}));
 const K=Object.values(I).sort((x,y)=>y.c-x.c).slice(0,6),mx=K[0]?K[0].c:1,d=a.filter(x=>x.m.rute==="Injeksi"&&hit(x.p));
 return `<h2>Obat injeksi</h2><div class="pn" style="padding:6px 14px 10px">${K.map((k,i)=>`<div class="cat">${esc(k.n)}<span>${k.c}×/hari</span><div class="bar"><i style="width:${k.c/mx*100}%;background:${COL[i%6]}"></i></div></div>`).join("")||'<div class="empty">Belum ada obat injeksi.</div>'}</div>
 <h2>Jadwal injeksi hari ini</h2><div class="pn">${d.map(x=>dr(x,1)).join("")||'<div class="empty">Tidak ada jadwal injeksi.</div>'}</div>`}
};
function hit(p){const q=$("#q").value.toLowerCase();return(p.nama+" "+p.kamar+" "+p.dokter+" "+(p.rc||"")).toLowerCase().includes(q)&&(view!=="pasien"||(pf!=="ada"||!!p.rc)&&(pf!=="tanpa"||!p.rc))}
function render(){
 const a=doses(),G=a.filter(x=>x.dn).length,L=a.filter(x=>x.late).length;
 $("#sub").textContent="R. Dahlia · "+new Date().toLocaleDateString("id-ID",{weekday:"long",day:"numeric",month:"long"});
 $("#v").innerHTML=V[view](a,G,L,a.length-G-L);
 $("#nav").innerHTML=[["home","Beranda","home"],["pill","Obat","obat",L],["users","Pasien","pasien"],["heart","TTV","ttv"],["syr","Injeksi","inj"]].map(n=>`<button class="${n[2]==view?"on":""}" data-go="${n[2]}" aria-label="${n[1]}">${ic(n[0])}${n[3]?`<b>${n[3]}</b>`:""}</button>`).join("");
 $("#bell").innerHTML=ic("bell")+(L?`<i>${L}</i>`:"");$("#sbt").innerHTML=ic("search")}
function drawSl(d,ck){const r=d.querySelector(".rt").value;let h="";
 if(JD[r])JD[r].forEach(g=>g[1].forEach(t=>h+=`<label><input type="checkbox" value="${t}"${ck.includes(t)?" checked":""}>${g[0]} ${t}</label>`));
 else{ck.slice().sort((a,b)=>tm(a)-tm(b)).forEach(t=>h+=`<label><input type="checkbox" value="${t}" checked>${t}</label>`);h+=`<span class="ad"><input type="time" class="nt" aria-label="Jam pemberian"><button type="button" class="btn sm ab">Tambah jam</button></span>`}
 d.querySelector(".sl").innerHTML=h;const b=d.querySelector(".ab");if(b)b.onclick=()=>{const v=d.querySelector(".nt").value;if(!v)return;const cur=[...d.querySelectorAll(".sl input:checked")].map(c=>c.value);if(!cur.includes(v))cur.push(v);drawSl(d,cur)}}
function medRow(m){m=m||{};const d=document.createElement("div");d.className="mr";d.dataset.id=m.id||uid();d.dataset.done=JSON.stringify(m.done||{});
 d.innerHTML=`<input class="mn" placeholder="Nama obat" aria-label="Nama obat" value="${esc(m.nama)}"><input class="md" placeholder="Dosis" aria-label="Dosis" value="${esc(m.dosis)}"><button type="button" class="btn sm" aria-label="Hapus obat">✕</button><select class="rt" aria-label="Rute">${["Oral","Injeksi","Cairan","Drip","Syringe pump"].map(r=>`<option>${r}</option>`).join("")}</select><div class="sl"></div>`;
 const s=d.querySelector(".rt");s.value=m.rute||"Oral";drawSl(d,m.jam||[]);s.onchange=()=>drawSl(d,[...d.querySelectorAll(".sl input:checked")].map(c=>c.value));d.querySelector("button").onclick=()=>d.remove();$("#meds").appendChild(d)}
function openP(id){editId=id;const p=data.find(x=>x.id===id)||{};$("#meds").innerHTML="";$("#nama").value=p.nama||"";$("#kamar").value=p.kamar||"";$("#dokter").value=p.dokter||"";$("#rc").value=p.rc||"";(p.obat&&p.obat.length?p.obat:[{}]).forEach(medRow);$("#del").hidden=!id;$("#dlg").showModal()}
function openT(){$("#tp").innerHTML=`<option value="">Pilih pasien</option>`+data.slice().sort(byRoom).map(p=>`<option value="${esc(p.id)}"${p.id===sel?" selected":""}>Kamar ${esc(p.kamar)} · ${esc(p.nama)}</option>`).join("");["td","nd","rr","sh","sp"].forEach(k=>$("#"+k).value="");$("#tdlg").showModal()}
$("#f").onsubmit=e=>{e.preventDefault();const old=data.find(x=>x.id===editId)||{};
 const obat=[...document.querySelectorAll("#meds .mr")].map(r=>{const n=r.querySelector(".mn").value.trim();if(!n)return null;const js=[...r.querySelectorAll(".sl input:checked")].map(c=>c.value);let od={};try{od=JSON.parse(r.dataset.done||"{}")}catch(x){}const nd={};js.forEach(s=>{if(od[s])nd[s]=od[s]});return{id:r.dataset.id,nama:n,dosis:r.querySelector(".md").value.trim(),jam:js,rute:r.querySelector(".rt").value,done:nd}}).filter(Boolean);
 const p={...old,id:old.id||uid(),nama:$("#nama").value.trim(),kamar:$("#kamar").value.trim(),dokter:$("#dokter").value.trim(),rc:$("#rc").value.trim(),obat};
 const i=data.findIndex(x=>x.id===p.id);if(i>-1)data[i]=p;else data.push(p);persist();render();$("#dlg").close();toast(i>-1?"Perubahan tersimpan":"Pasien ditambahkan")};
$("#tf").onsubmit=e=>{e.preventDefault();const id=$("#tp").value,v={};["td","nd","rr","sh","sp"].forEach(k=>{const x=$("#"+k).value.trim();if(x)v[k]=x});
 if(!Object.keys(v).length){toast("Isi minimal satu nilai TTV");return}if(v.td&&!/^\d{2,3}\/\d{2,3}$/.test(v.td)){toast("Isi tekanan darah dengan format 120/80");return}
 const p=data.find(x=>x.id===id);if(!p)return;const t=nowStr();Object.assign(p,v,{wt:t.slice(11,16)});p.ttv=(p.ttv||[]).concat([{t,...v}]).slice(-50);sel=p.id;persist();render();$("#tdlg").close();toast(Object.keys(abn(v)).length?"TTV tersimpan. Ada nilai di luar batas normal.":"TTV tersimpan")};
$("#del").onclick=()=>{const id=editId;ask("Hapus catatan pasien ini?",()=>{data=data.filter(x=>x.id!==id);persist();render();$("#dlg").close();toast("Pasien dihapus")})};
$("#cy").onclick=()=>{const f=askCb;askCb=null;$("#cdlg").close();if(f)f()};
$("#br").onclick=()=>{try{const v=JSON.parse($("#bt").value);if(!Array.isArray(v))throw 0;ask("Ganti semua data dengan data cadangan?",()=>{data=v;persist();render();$("#bdlg").close();toast("Data dipulihkan")})}catch(e){toast("Teks cadangan tidak valid")}};
document.addEventListener("click",e=>{
 const b=e.target.closest("button");if(!b)return;
 if(b.hasAttribute("data-x"))return b.closest("dialog").close();
 if(b.dataset.go){view=b.dataset.go;window.scrollTo(0,0);return render()}
 if(b.dataset.tp){expanded[b.dataset.tp]=!expanded[b.dataset.tp];return render()}
 if(b.dataset.f!==undefined){tab=b.dataset.f;return render()}
 if(b.dataset.p!==undefined){pf=b.dataset.p;return render()}
 if(b.dataset.s){sel=b.dataset.s;return render()}
 if(b.dataset.e)return openP(b.dataset.e);
 if(b.dataset.q){const q=b.dataset.q;return q=="add"?openP(null):q=="ttv"?openT():($("#bt").value=JSON.stringify(data),$("#bdlg").showModal(),$("#bt").select())}
 if(b.dataset.t){const a=b.dataset.t.split("|"),p=data.find(x=>x.id===a[0]),m=p&&p.obat.find(x=>x.id===a[1]);if(m){m.done=m.done||{};m.done[a[2]]=isToday(m.done[a[2]])?"":nowStr();persist();render()}}});
$("#bell").onclick=()=>{view="obat";tab="";window.scrollTo(0,0);render()};
$("#sbt").onclick=()=>{const s=$("#sb"),on=s.classList.toggle("on");if(on)$("#q").focus();else{$("#q").value="";render()}};
$("#addm").onclick=()=>medRow();$("#q").oninput=render;
try{const r=localStorage.getItem(KEY);if(r)data=JSON.parse(r)||[];data.forEach(p=>(p.obat||[]).forEach(m=>{if(!Array.isArray(m.jam))m.jam=m.jam?[m.jam]:[];m.rute=m.rute||"Oral";m.done=m.done||{}}))}catch(e){data=[]}
render();setInterval(render,60000);
// Muat data awal dari Google Sheet
loadFromCloud();
</script>
