label{display:block;font-size:12.5px;font-weight:700;color:var(--mu);margin:8px 0 3px}

.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}

.mr.mr-filled .mr-st .badge{background:var(--okb);color:var(--ok)}

<body>
<header class="hd"><div class="av">🧑‍⚕️</div><div><b>Halo, Perawat!</b><small id="sub"></small></div>
  <button class="ib" id="sbt" aria-label="Cari"></button><button class="ib" id="bell" aria-label="Lihat obat terlambat"></button></header>
<div class="sb" id="sb"><input id="q" placeholder="Cari nama, kamar, dokter…" aria-label="Cari"></div>
<main id="v"></main>
<p class="foot"><span>Data tersimpan lokal & tersinkron ke Google Sheet.</span> Alat bantu catatan, bukan pengganti rekam medis resmi.</p>
<nav id="nav" aria-label="Menu utama"></nav>

<dialog id="dlg"><form id="f" novalidate><h3>Data pasien</h3>
  <div class="legend"><span><i class="l-fil"></i> Sudah terisi</span><span><i class="l-emp"></i> Belum terisi</span></div>
  <label for="nama">Nama pasien</label><input id="nama" required>
  <div class="g2"><div><label for="kamar">Kamar</label><select id="kamar" required></select></div><div><label for="dokter">Dokter</label><input id="dokter" required></div></div>
  <label>Obat</label><div id="meds"></div><button type="button" class="btn sm" id="addm">Tambah obat</button>
  <label for="rc">Rencana tindakan</label><textarea id="rc" rows="3" placeholder="Contoh: observasi TTV tiap 4 jam"></textarea>
  <div class="row"><button type="button" class="btn" id="del" style="margin-right:auto;color:var(--lt)" hidden>Hapus pasien</button><button type="button" class="btn" data-x>Batal</button><button class="btn pri">Simpan</button></div>
</form></dialog>
<dialog id="tdlg"><form id="tf"><h3>Input TTV</h3>
  <label for="tp">Pasien</label><select id="tp" required></select>
  <div class="g3"><div><label for="td">Tekanan darah</label><input id="td" placeholder="120/80"></div><div><label for="nd">Nadi (x/mnt)</label><input id="nd" type="number"></div><div><label for="rr">Napas (x/mnt)</label><input id="rr" type="number"></div><div><label for="sh">Suhu (°C)</label><input id="sh" type="number" step="0.1"></div><div><label for="sp">SpO₂ (%)</label><input id="sp" type="number"></div></div>
  <div class="row"><button type="button" class="btn" data-x>Batal</button><button class="btn pri">Simpan TTV</button></div>
</form></dialog>
<dialog id="bdlg"><h3>Cadangkan / Pulihkan</h3><p style="color:var(--mu);font-size:12px">Cadangkan: salin teks di bawah. Pulihkan: tempel teks cadangan lalu tekan Pulihkan.</p><label for="bt">Data cadangan</label><textarea id="bt" rows="9"></textarea>
  <div class="row"><button class="btn" data-x>Tutup</button><button class="btn pri" id="br">Pulihkan</button></div></dialog>
<dialog id="cdlg"><p id="cm" style="margin-bottom:6px"></p><div class="row"><button class="btn" data-x>Batal</button><button class="btn pri" id="cy" style="background:#dc2626;color:#fff">Ya, lanjutkan</button></div></dialog>

<script>
// URL Google Apps Script yang terhubung ke Google Sheet
const GAS_URL = "https://script.google.com/macros/s/AKfycbyQRjgf7Et79WLd_UN5TO3WA8WWBjsTBWbIkh3L6tB8nDvEiGesAlkOo9xny0n1B0Rw/exec";

const P={search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>',bell:'<path d="M6 16V11a6 6 0 0112 0v5l2 2H4z"/><path d="M10 21h4"/>',plus:'<path d="M12 5v14M5 12h14"/>',chev:'<path d="M9 6l6 6-6 6"/>',home:'<path d="M3 11l9-8 9 8v9H3z"/>',users:'<circle cx="9" cy="8" r="3.5"/><path d="M2 20c0-4 3-6 7-6s7 2 7 6M17 5a3.5 3.5 0 010 7M22 20c0-3-2-5-5-5.5"/>',heart:'<path d="M12 20s-8-5-8-11a4.5 4.5 0 018-2.5A4.5 4.5 0 0120 9c0 6-8 11-8 11z"/>',syr:'<path d="M18 3l3 3-3 3M15 6l-9 9v3h3l9-9M3 21l3-3"/>',check:'<path d="M5 12l5 5 9-10"/>',pill:'<rect x="3" y="9" width="18" height="6" rx="3" transform="rotate(-35 12 12)"/><path d="M9 8l6 8"/>',undo:'<path d="M9 14L4 9l5-5M4 9h10a6 6 0 010 12h-3"/>',edit:'<path d="M4 20h4L19 9l-4-4L4 16z"/>',arr:'<path d="M5 12h14M13 6l6 6-6 6"/>',drop:'<path d="M12 3s6 6.5 6 11a6 6 0 01-12 0c0-4.5 6-11 6-11z"/>',calc:'<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 7h8M8 12h.1M12 12h.1M16 12h.1M8 16h.1M12 16h.1M16 16h.1"/>'};
const ic=n=>`<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${P[n]}</svg>`;
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const KEY="catatan-obat-v1",uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6),p2=n=>String(n).padStart(2,"0");
let data=[],tab="",pf="",view="home",sel="",editId=null,askCb=null;
const expT={},expanded={},COL=["#a592e6","#f7a8b6","#f9b85a","#f6dc7a","#a5d8a0","#93b9ee"];
const nowStr=()=>{const d=new Date();return `${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}T${p2(d.getHours())}:${p2(d.getMinutes())}`};
const isToday=v=>typeof v==="string"&&v.slice(0,10)===nowStr().slice(0,10),fmt=v=>typeof v==="string"&&v.length>=16?v.slice(11,16):"";
const toMin=t=>{const a=(t||"").split(":");return a.length<2?0:+a[0]*60+ +a[1]},tm=s=>{const t=toMin(s);return t<360?t+1440:t},nowMin=()=>{const d=new Date();return d.getHours()*60+d.getMinutes()};
const JD={Injeksi:[["Pagi",["09:00"]],["Siang",["17:00","21:00"]],["Malam",["01:00"]]],Oral:[["Pagi",["07:00","12:00","15:00"]],["Sore",["19:00"]],["Malam",["23:00"]]]};
const bt=s=>{const t=toMin(s);return t>=360&&t<720?"Pagi":t>=720&&t<1080?"Siang":"Malam"};
const grp=(r,s)=>{let g="";(JD[r||"Oral"]||[]).forEach(x=>{if(x[1].includes(s))g=x[0]});return g||bt(s)};
const shift=(m,s)=>(m.rute||"Oral")==="Oral"&&s==="07:00"?"Malam":(g=>g==="Sore"?"Siang":g)(grp(m.rute,s));
function abn(p){const a={},s=(p.td||"").split("/");if(s.length==2&&(+s[0]>=140||+s[0]<90||+s[1]>=90))a.td=1;if(p.nd&&(p.nd>100||p.nd<60))a.nd=1;if(p.rr&&(p.rr>24||p.rr<12))a.rr=1;if(p.sh&&(p.sh>=37.5||p.sh<36))a.sh=1;if(p.sp&&p.sp<95)a.sp=1;return a}
const ROOMS=[...Array.from({length:12},(_,i)=>"K-"+(i+1)),"ISO-A","ISO-B"],
normRoom=v=>{v=String(v??"").trim();let m=v.match(/^k\s*-?\s*(\d{1,2})$/i);if(m&&+m[1]>=1&&+m[1]<=12)return"K-"+ +m[1];m=v.match(/^iso\s*-?\s*([ab])$/i);return m?"ISO-"+m[1].toUpperCase():v},
byRoom=(a,b)=>{const i=ROOMS.indexOf(a.kamar),j=ROOMS.indexOf(b.kamar);return(i<0?99:i)-(j<0?99:j)||String(a.kamar).localeCompare(String(b.kamar),"id",{numeric:true})};
function toast(t){const e=document.createElement("div");e.className="toast";e.textContent=t;e.setAttribute("role","status");document.body.appendChild(e);setTimeout(()=>e.remove(),2200)}
function ask(msg,cb){$("#cm").textContent=msg;askCb=cb;$("#cdlg").showModal()}

// SINKRONISASI KE GOOGLE SHEETS (CLOUD)
async function persist(){
  try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}
  if(!GAS_URL||GAS_URL.includes("ISI_URL_GOOGLE_APPS_SCRIPT"))return;
  try{await fetch(GAS_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'save',data:data})})}
  catch(e){console.error("Gagal sinkron ke Cloud:",e);toast("Gagal sinkron ke Cloud")}
}
async function loadFromCloud(){

 d.innerHTML=`<div class="mr-st"><span class="mr-title">Obat</span><span class="badge">Belum diisi</span></div><input class="mn" placeholder="Nama obat" aria-label="Nama obat" value="${esc(m.nama)}"><input class="md" placeholder="Dosis" aria-label="Dosis" value="${esc(m.dosis)}"><button type="button" class="btn sm" aria-label="Hapus obat">✕</button><select class="rt" aria-label="Rute">${["Oral","Injeksi","Cairan","Drip","Syringe pump"].map(r=>`<option>${r}</option>`).join("")}</select><div class="sl"></div><label class="kpl"><input type="checkbox" class="kp"> K/P (jika perlu)</label>`;
 const s=d.querySelector(".rt");s.value=m.rute||"Oral";d.querySelector(".kp").checked=!!m.kp;drawSl(d,m.jam||[]);s.onchange=()=>{drawSl(d,[...d.querySelectorAll(".sl input:checked")].map(c=>c.value));syncFormState()};d.querySelector("button").onclick=()=>{d.remove();syncFormState()};$("#meds").appendChild(d);syncFormState()}
function openP(id){editId=id;const p=data.find(x=>x.id===id)||{};$("#meds").innerHTML="";$("#nama").value=p.nama||"";const kr=normRoom(p.kamar||"");$("#kamar").innerHTML=`<option value="">Pilih kamar</option>`+ROOMS.concat(kr&&!ROOMS.includes(kr)?[kr]:[]).map(r=>`<option>${esc(r)}</option>`).join("");$("#kamar").value=kr;$("#dokter").value=p.dokter||"";$("#rc").value=p.rc||"";(p.obat&&p.obat.length?p.obat:[{}]).forEach(medRow);$("#del").hidden=!id;$("#dlg").showModal();syncFormState()}
function openT(){$("#tp").innerHTML=`<option value="">Pilih pasien</option>`+data.slice().sort(byRoom).map(p=>`<option value="${esc(p.id)}"${p.id===sel?" selected":""}>Kamar ${esc(p.kamar)} · ${esc(p.nama)}</option>`).join("");["td","nd","rr","sh","sp"].forEach(k=>$("#"+k).value="");$("#tdlg").showModal()}
$("#f").onsubmit=e=>{e.preventDefault();try{if(!$("#nama").value.trim()){toast("Isi nama pasien");$("#nama").focus();return}if(!$("#kamar").value){toast("Pilih kamar");$("#kamar").focus();return}if(!$("#dokter").value.trim()){toast("Isi nama dokter");$("#dokter").focus();return}saveP()}catch(x){console.error(x);toast("Gagal menyimpan: "+x.message)}};
function saveP(){const old=data.find(x=>x.id===editId)||{};
 const obat=[...document.querySelectorAll("#meds .mr")].map(r=>{const n=r.querySelector(".mn").value.trim();if(!n)return null;const js=[...r.querySelectorAll(".sl input:checked")].map(c=>c.value),nt=r.querySelector(".nt");if(nt&&nt.value&&!js.includes(nt.value))js.push(nt.value);let od={};try{od=JSON.parse(r.dataset.done||"{}")}catch(x){}const nd={};js.forEach(s=>{if(od[s])nd[s]=od[s]});if(od["-"])nd["-"]=od["-"];let kg=[];try{kg=JSON.parse(r.dataset.kpg||"[]")}catch(x){}const ru=r.querySelector(".rt").value;return{id:r.dataset.id,nama:n,dosis:r.querySelector(".md").value.trim(),jam:js,rute:ru,done:nd,kp:!!(JD[ru]&&r.querySelector(".kp").checked),kpg:kg}}).filter(Boolean);
 const p={...old,id:old.id||uid(),nama:$("#nama").value.trim(),kamar:$("#kamar").value.trim(),dokter:$("#dokter").value.trim(),rc:$("#rc").value.trim(),obat};
 const i=data.findIndex(x=>x.id===p.id);if(i>-1)data[i]=p;else data.push(p);persist();$("#dlg").close();toast(i>-1?"Perubahan tersimpan":"Pasien ditambahkan");render()};
$("#tf").onsubmit=e=>{e.preventDefault();const id=$("#tp").value,v={};["td","nd","rr","sh","sp"].forEach(k=>{const x=$("#"+k).value.trim();if(x)v[k]=x});
 if(!Object.keys(v).length){toast("Isi minimal satu nilai TTV");return}if(v.td&&!/^\d{2,3}\/\d{2,3}$/.test(v.td)){toast("Isi tekanan darah dengan format 120/80");return}
 const p=data.find(x=>x.id===id);if(!p)return;const t=nowStr();Object.assign(p,v,{wt:t.slice(11,16)});p.ttv=(p.ttv||[]).concat([{t,...v}]).slice(-50);sel=p.id;persist();render();$("#tdlg").close();toast(Object.keys(abn(v)).length?"TTV tersimpan. Ada nilai di luar batas normal.":"TTV tersimpan")};
$("#del").onclick=()=>{const id=editId;ask("Hapus catatan pasien ini?",()=>{data=data.filter(x=>x.id!==id);persist();render();$("#dlg").close();toast("Pasien dihapus")})};
$("#cy").onclick=()=>{const f=askCb;askCb=null;$("#cdlg").close();if(f)f()};
$("#br").onclick=()=>{try{const v=JSON.parse($("#bt").value);if(!Array.isArray(v))throw 0;ask("Ganti semua data dengan data cadangan?",()=>{data=v;persist();render();$("#bdlg").close();toast("Data dipulihkan")})}catch(e){toast("Teks cadangan tidak valid")}};
document.addEventListener("click",e=>{
 const b=e.target.closest("button");if(!b)return;
 if(b.hasAttribute("data-x"))return b.closest("dialog").close();
 if(b.dataset.go){view=b.dataset.go;window.scrollTo(0,0);return render()}
 if(b.dataset.tp){expanded[b.dataset.tp]=!expanded[b.dataset.tp];return render()}
 if(b.dataset.f!==undefined){tab=b.dataset.f;return render()}
 if(b.dataset.p!==undefined){pf=b.dataset.p;return render()}
 if(b.dataset.s){sel=b.dataset.s;return render()}
 if(b.dataset.tt){expT[b.dataset.tt]=!expT[b.dataset.tt];sel=b.dataset.tt;return render()}
 if(b.dataset.kd){K.d=b.dataset.kd;const D=DEF[K.d];K.mg=D.mg;K.ml=D.ml;K.s=D.s;K.st=D.st;return render()}
 if(b.dataset.ota){const a=b.dataset.ota.split("|"),p=data.find(x=>x.id===a[0]),m=p&&p.obat.find(x=>x.id===a[1]);if(m){m.done=m.done||{};m.done[a[2]]=m.done[a[2]]==="OTA"?"":"OTA";persist();render()}return}
 if(b.dataset.kx){const a=b.dataset.kx.split("|"),p=data.find(x=>x.id===a[0]),m=p&&p.obat.find(x=>x.id===a[1]);if(m){m.kpg=m.kpg||[];if(a[2]==="a")m.kpg.push(nowStr());else{const i=m.kpg.map(isToday).lastIndexOf(true);if(i>-1)m.kpg.splice(i,1)}m.kpg=m.kpg.slice(-60);persist();render()}return}
 if(b.dataset.sv)return svRc(b.dataset.sv);
 if(b.dataset.e)return openP(b.dataset.e);
 if(b.dataset.q){const q=b.dataset.q;return q=="add"?openP(null):q=="ttv"?openT():($("#bt").value=JSON.stringify(data),$("#bdlg").showModal(),$("#bt").select())}
 if(b.dataset.t){const a=b.dataset.t.split("|"),p=data.find(x=>x.id===a[0]),m=p&&p.obat.find(x=>x.id===a[1]);if(m){m.done=m.done||{};m.done[a[2]]=isToday(m.done[a[2]])?"":nowStr();persist();render()}}});
$("#bell").onclick=()=>{view="obat";tab="";window.scrollTo(0,0);render()};
$("#sbt").onclick=()=>{const s=$("#sb"),on=s.classList.toggle("on");if(on)$("#q").focus();else{$("#q").value="";render()}};
$("#addm").onclick=()=>medRow();$("#q").oninput=render;
try{const r=localStorage.getItem(KEY);if(r)data=JSON.parse(r)||[];data.forEach(p=>(p.obat||[]).forEach(m=>{if(!Array.isArray(m.jam))m.jam=m.jam?[m.jam]:[];m.rute=m.rute||"Oral";m.done=m.done||{}}))}catch(e){data=[]}
data.forEach(p=>{p.kamar=normRoom(p.kamar)});render();setInterval(()=>{if(view!=="bal"&&view!=="kal")render()},60000);
